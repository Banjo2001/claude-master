# =============================================================================
# DATEI:    .github/workflows/lint.yml
# ZWECK:    Prüft Ansible-Dateien und YAML auf Syntax und Best Practices
#           bei jedem Push und Pull Request.
#
# WAS WIRD GEPRÜFT:
#   - yamllint: YAML-Syntax und Formatierung
#   - ansible-lint: Ansible Best Practices und Sicherheit
#   - shellcheck: Shell-Skripte auf Fehler prüfen
# =============================================================================

name: Ansible Lint + YAML Lint

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "claude/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - name: "Repository auschecken"
        uses: actions/checkout@v4

      - name: "yamllint via apt installieren"
        run: sudo apt-get install -y yamllint

      - name: "yamllint Version prüfen"
        run: yamllint --version

      - name: "GitHub Actions Workflows prüfen (immer)"
        run: yamllint -c .yamllint.yml .github/

      - name: "Ansible YAML-Dateien prüfen (wenn vorhanden)"
        run: |
          # WICHTIG: Klammern um -o Alternativen, damit find korrekt sucht!
          # Ohne Klammern: find sucht *.yaml überall im System, nicht nur in ansible/
          YAML_FILES=$(find ansible/ \( -name "*.yml" -o -name "*.yaml" \) \
            -type f ! -name ".gitkeep" 2>/dev/null | sort)

          if [ -z "$YAML_FILES" ]; then
            echo "INFO: Noch keine Ansible YAML-Dateien vorhanden — überspringe"
          else
            echo "Prüfe Ansible YAML-Dateien:"
            echo "$YAML_FILES"
            echo "$YAML_FILES" | xargs yamllint -c .yamllint.yml
          fi

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    needs: yamllint

    steps:
      - name: "Repository auschecken"
        uses: actions/checkout@v4

      - name: "CI-Vault und Vault-Passwort erstellen (Syntax-Check only)"
        run: |
          # WARUM: ansible.cfg setzt vault_password_file=~/.vault_pass.txt.
          # In CI existiert diese Datei nicht. ansible-lint würde scheitern.
          # Dummy-Werte sind sicher: Datei wird NICHT committed — nur für Lint.
          echo "ci-dummy-vault-password" > ~/.vault_pass.txt

          # WARUM: hosts.yml+vars.yml existieren jetzt im Repo, daher kann
          # ansible-lint das Inventar laden und Syntax-Checks durchführen.
          # vault.yml wird von Playbooks per vars_files eingebunden aber nicht
          # committet (enthält Secrets auf echtem System). CI braucht Dummy.
          mkdir -p ansible/inventories/prod/group_vars/all
          cat > ansible/inventories/prod/group_vars/all/vault.yml << 'VAULTEOF'
          ---
          # CI ONLY — Keine echten Secrets! Nur für ansible-lint Syntax-Check.
          # Werte: <WIRD_VIA_VAULT_GESETZT> = gitleaks-Allowlist-Pattern (kein Alarm)
          vault_pve_api_token_id: "<WIRD_VIA_VAULT_GESETZT>"
          vault_pve_api_token_secret: "<WIRD_VIA_VAULT_GESETZT>"
          vault_pbs_api_token_id: "<WIRD_VIA_VAULT_GESETZT>"
          vault_pbs_api_token_secret: "<WIRD_VIA_VAULT_GESETZT>"
          vault_matrix_registration_shared_secret: "<WIRD_VIA_VAULT_GESETZT>"
          vault_matrix_macaroon_secret_key: "<WIRD_VIA_VAULT_GESETZT>"
          vault_matrix_db_password: "<WIRD_VIA_VAULT_GESETZT>"
          vault_coturn_auth_secret: "<WIRD_VIA_VAULT_GESETZT>"
          vault_nextcloud_db_password: "<WIRD_VIA_VAULT_GESETZT>"
          vault_nextcloud_db_root_password: "<WIRD_VIA_VAULT_GESETZT>"
          vault_nextcloud_admin_password: "<WIRD_VIA_VAULT_GESETZT>"
          vault_control_node_ssh_pubkey: "<WIRD_VIA_VAULT_GESETZT>"
          vault_smtp_password: "<WIRD_VIA_VAULT_GESETZT>"
          VAULTEOF

      - name: "Ansible Lint ausführen (nur wenn Playbooks vorhanden)"
        run: |
          # Installation und Ausführung NUR wenn Ansible-Dateien vorhanden
          # Verhindert unnötige pip/Galaxy-Netzwerkzugriffe bei leerem ansible/
          YAML_FILES=$(find ansible/ -name "*.yml" -type f \
            ! -name ".gitkeep" 2>/dev/null | sort)

          if [ -z "$YAML_FILES" ]; then
            echo "INFO: Noch keine Ansible-Playbooks vorhanden — überspringe"
            exit 0
          fi

          echo "Ansible-Dateien gefunden:"
          echo "$YAML_FILES"
          echo ""

          pip install ansible-lint
          ansible-galaxy collection install community.general
          ansible-galaxy collection install community.docker
          ansible-galaxy collection install ansible.posix

          ansible-lint ansible/

  shell-lint:
    name: Shell Script Lint
    runs-on: ubuntu-latest

    steps:
      - name: "Repository auschecken"
        uses: actions/checkout@v4

      - name: "shellcheck installieren"
        run: sudo apt-get install -y shellcheck

      - name: "Shell-Skripte prüfen (wenn vorhanden)"
        run: |
          SHELL_FILES=$(find . -path './.git' -prune -o \
            -name "*.sh" -type f -print 2>/dev/null | sort)

          if [ -z "$SHELL_FILES" ]; then
            echo "INFO: Noch keine Shell-Skripte — überspringe shellcheck"
          else
            echo "Prüfe Shell-Skripte:"
            echo "$SHELL_FILES"
            echo "$SHELL_FILES" | xargs shellcheck --severity=warning
          fi
