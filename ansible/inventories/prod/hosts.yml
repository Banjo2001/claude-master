---
# =============================================================================
# hosts.yml — Ansible Inventar (Produktion)
# ZWECK:     Alle verwalteten Hosts gruppiert nach Funktion
# ANPASSEN:  Echte IPs eintragen! Platzhalter-IPs sind RFC 5737 TEST-NET
# SICHERHEIT: Keine Secrets hier — Secrets gehören in vault.yml
# =============================================================================

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3

  children:

    # ─── Proxmox VE ──────────────────────────────────────────────────────────
    proxmox_ve:
      hosts:
        pve01:
          # ANPASSEN: Echte IP des Proxmox-Hosts eintragen
          ansible_host: "192.0.2.10"
          ansible_user: root
          ansible_ssh_private_key_file: "~/.ssh/id_ed25519_proxmox"

    # ─── Proxmox Backup Server ────────────────────────────────────────────────
    proxmox_backup:
      hosts:
        pbs01:
          # ANPASSEN: Echte IP des PBS-Hosts eintragen
          ansible_host: "192.0.2.11"
          ansible_user: root
          ansible_ssh_private_key_file: "~/.ssh/id_ed25519_proxmox"

    # ─── Matrix Synapse (LXC Container auf PVE) ──────────────────────────────
    matrix_servers:
      hosts:
        matrix01:
          # ANPASSEN: Echte IP des Matrix LXC Containers eintragen
          ansible_host: "192.0.2.20"
          ansible_user: root
          ansible_ssh_private_key_file: "~/.ssh/id_ed25519_proxmox"

    # ─── Nextcloud AIO (LXC Container auf PVE) ───────────────────────────────
    nextcloud_servers:
      hosts:
        nextcloud01:
          # ANPASSEN: Echte IP des Nextcloud LXC Containers eintragen
          ansible_host: "192.0.2.21"
          ansible_user: root
          ansible_ssh_private_key_file: "~/.ssh/id_ed25519_proxmox"

    # ─── Alle App-Server (Matrix + Nextcloud) ────────────────────────────────
    app_servers:
      children:
        matrix_servers:
        nextcloud_servers:

    # ─── Alle verwalteten Server ─────────────────────────────────────────────
    managed:
      children:
        proxmox_ve:
        proxmox_backup:
        app_servers:
