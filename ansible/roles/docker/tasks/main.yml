---
# =============================================================================
# DATEI:        ansible/roles/docker/tasks/main.yml
# ZWECK:        Docker CE (Community Edition) installieren und konfigurieren.
#               WICHTIG: docker.io aus dem Ubuntu/Debian-Repo NICHT verwenden!
#               Nur docker-ce aus dem offiziellen Docker-Repository nutzen.
# ROLLBACK:     apt remove docker-ce docker-ce-cli containerd.io
# =============================================================================

- name: "Alte Docker-Pakete entfernen (falls vorhanden)"
  ansible.builtin.apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent
  ignore_errors: true

- name: "Docker Repository GPG-Schlüssel importieren"
  ansible.builtin.apt_key:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    keyring: /etc/apt/keyrings/docker.gpg
    state: present

- name: "Verzeichnis für Keyring erstellen"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Docker Repository hinzufügen"
  ansible.builtin.apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker
    update_cache: true

- name: "Docker CE Pakete installieren"
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: "Docker Daemon konfigurieren (/etc/docker/daemon.json)"
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart_docker

- name: "Docker starten und beim Boot aktivieren"
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: "Benutzer zur docker-Gruppe hinzufügen"
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: docker_users | length > 0

- name: "Docker-Version verifizieren"
  ansible.builtin.command: docker --version
  register: docker_version_output
  changed_when: false

- name: "Docker Compose v2 verifizieren"
  ansible.builtin.command: docker compose version
  register: compose_version_output
  changed_when: false

- name: "Versionen ausgeben"
  ansible.builtin.debug:
    msg:
      - "{{ docker_version_output.stdout }}"
      - "{{ compose_version_output.stdout }}"
