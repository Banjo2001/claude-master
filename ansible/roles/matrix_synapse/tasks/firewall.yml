---
# =============================================================================
# DATEI:        ansible/roles/matrix_synapse/tasks/firewall.yml
# ZWECK:        UFW-Regeln für Matrix Synapse öffnen
# ROLLBACK:     ufw delete allow <PORT>
# =============================================================================

- name: "UFW — Port 80 für HTTP/HTTPS Challenge öffnen"
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    comment: "HTTP (Let's Encrypt, Matrix)"

- name: "UFW — Port 443 für HTTPS öffnen"
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    comment: "HTTPS (Matrix)"

- name: "UFW — Coturn STUN/TURN TCP öffnen"
  community.general.ufw:
    rule: allow
    port: "{{ coturn_listening_port }}"
    proto: tcp
    comment: "Coturn STUN/TURN TCP"

- name: "UFW — Coturn STUN/TURN UDP öffnen"
  community.general.ufw:
    rule: allow
    port: "{{ coturn_listening_port }}"
    proto: udp
    comment: "Coturn STUN/TURN UDP"

- name: "UFW — Coturn TLS TCP öffnen"
  community.general.ufw:
    rule: allow
    port: "{{ coturn_tls_listening_port }}"
    proto: tcp
    comment: "Coturn STUN/TURN TLS TCP"

- name: "UFW — Coturn Media-Port-Range UDP öffnen"
  community.general.ufw:
    rule: allow
    port: "{{ coturn_min_port }}:{{ coturn_max_port }}"
    proto: udp
    comment: "Coturn Media (UDP)"
