---
# =============================================================================
# DATEI:        ansible/roles/matrix_synapse/tasks/redis.yml
# ZWECK:        Redis-Konfiguration für Matrix Synapse (Worker-Koordination)
# ROLLBACK:     docker compose down redis
# =============================================================================

- name: "Redis-Konfigurationsdatei erstellen"
  ansible.builtin.copy:
    dest: "{{ matrix_config_dir }}/redis.conf"
    content: |
      # Redis Konfiguration für Matrix Synapse
      # WARUM 0.0.0.0: Redis läuft in einem Docker-Container auf dem
      # internen matrix_internal-Netzwerk (internal: true = kein Internet-Zugang).
      # Synapse und Redis sind separate Container — bind 127.0.0.1 würde
      # Synapse den Zugriff verweigern. Das interne Netzwerk ist sicher.
      bind 0.0.0.0
      port {{ matrix_redis_port }}
      # Passwort (optional für lokale Deployments)
      # requirepass your_password_here
      # Persistenz deaktivieren (nur Cache, kein persistenter Zustand)
      save ""
      appendonly no
      # Maximaler Arbeitsspeicher
      maxmemory 256mb
      maxmemory-policy allkeys-lru
    owner: "999"
    group: "999"
    mode: "0640"
