---
# =============================================================================
# DATEI:        ansible/roles/common/tasks/ufw.yml
# ZWECK:        UFW-Firewall mit Default-Deny einrichten
# ROLLBACK:     ufw disable
# KRITISCH:     SSH-Port MUSS freigegeben sein bevor UFW aktiviert wird!
# =============================================================================

- name: "UFW — Standard-Policy: Alle eingehenden Verbindungen ablehnen"
  community.general.ufw:
    policy: deny
    direction: incoming

- name: "UFW — Standard-Policy: Alle ausgehenden Verbindungen erlauben"
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: "UFW — SSH von erlaubten Quellen freigeben"
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port | string }}"
    proto: tcp
    src: "{{ item }}"
    comment: "SSH Management Access"
  loop: "{{ ufw_allowed_ssh_sources }}"

- name: "UFW aktivieren"
  community.general.ufw:
    state: enabled
  register: ufw_result

- name: "UFW Status anzeigen"
  ansible.builtin.command: ufw status verbose
  changed_when: false
  register: ufw_status

- name: "UFW Status ausgeben"
  ansible.builtin.debug:
    var: ufw_status.stdout_lines
