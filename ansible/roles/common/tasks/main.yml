---
# =============================================================================
# DATEI:        ansible/roles/common/tasks/main.yml
# ZWECK:        Basis-Konfiguration für alle Hosts (Pakete, SSH, UFW, Fail2Ban)
# ROLLBACK:     git checkout -- und Ansible erneut ausführen
# =============================================================================

- name: "Basis-Pakete aktualisieren und installieren"
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Zeitzone setzen"
  community.general.timezone:
    name: "{{ timezone }}"
  notify: restart_cron

- name: "Unattended-Upgrades konfigurieren"
  ansible.builtin.include_tasks: unattended_upgrades.yml
  when: unattended_upgrades_enabled

- name: "SSH härten"
  ansible.builtin.include_tasks: ssh_hardening.yml

- name: "UFW-Firewall konfigurieren"
  ansible.builtin.include_tasks: ufw.yml

- name: "Fail2Ban konfigurieren"
  ansible.builtin.include_tasks: fail2ban.yml

- name: "Kernel-Härtung (sysctl) anwenden"
  ansible.builtin.include_tasks: sysctl.yml
  when: sysctl_hardening_enabled
