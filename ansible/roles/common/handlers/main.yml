---
# =============================================================================
# DATEI:        ansible/roles/common/handlers/main.yml
# ZWECK:        Handler für die Common-Rolle
#               Handler werden nur ausgeführt wenn notify: ausgelöst wird
# =============================================================================

- name: "Restart sshd"
  ansible.builtin.service:
    name: sshd
    state: restarted
  listen: restart_sshd

- name: "Restart fail2ban"
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  listen: restart_fail2ban

- name: "Restart cron"
  ansible.builtin.service:
    name: cron
    state: restarted
  listen: restart_cron

- name: "Apply sysctl"
  ansible.builtin.command: sysctl --system
  changed_when: false
  listen: apply_sysctl

- name: "Reload ufw"
  ansible.builtin.command: ufw reload
  changed_when: false
  listen: reload_ufw
