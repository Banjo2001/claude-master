# =============================================================================
# DATEI:        config/sysctl/99-hardening.conf
# ZWECK:        Kernel-Hardening nach CIS Benchmark und BSI Empfehlungen
# EINBINDEN:    cp 99-hardening.conf /etc/sysctl.d/99-hardening.conf
# ANWENDEN:     sysctl --system  (oder: sysctl -p /etc/sysctl.d/99-hardening.conf)
# ROLLBACK:     rm /etc/sysctl.d/99-hardening.conf && sysctl --system
# =============================================================================

# =============================================================================
# ─── Netzwerk-Hardening ──────────────────────────────────────────────────────
# =============================================================================

# IP-Spoofing-Schutz: Pakete mit unmöglichen Quell-IPs verwerfen
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# ICMP-Redirects ignorieren (verhindert Man-in-the-Middle über ICMP)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# ICMP-Redirects nicht senden (kein Router-Verhalten)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Source-Routing deaktivieren
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Secure ICMP: Smurf-Attack-Schutz (Broadcast-Pings ignorieren)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ungültige ICMP-Fehlermeldungen ignorieren
net.ipv4.icmp_ignore_bogus_error_responses = 1

# SYN-Flood-Schutz aktivieren
net.ipv4.tcp_syncookies = 1

# TCP-FIN-WAIT-2 Timeout reduzieren
net.ipv4.tcp_fin_timeout = 15

# TCP-Keepalive: Tote Verbindungen schneller erkennen
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_keepalive_intvl = 15

# IPv6-Router-Advertisements ignorieren
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Log martian packets (Pakete mit unmöglichen Quell-IPs)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# =============================================================================
# ─── Kernel-Hardening ────────────────────────────────────────────────────────
# =============================================================================

# ASLR (Address Space Layout Randomization) maximieren
# 2 = vollständiges ASLR (CIS Benchmark Anforderung)
kernel.randomize_va_space = 2

# Core-Dumps einschränken (verhindert Passwort-Leaks in Core-Dumps)
fs.suid_dumpable = 0

# dmesg-Zugriff auf root beschränken
kernel.dmesg_restrict = 1

# Kernel-Pointer verbergen (gegen Kernel-Exploit-Entwicklung)
kernel.kptr_restrict = 2

# Performance events einschränken
kernel.perf_event_paranoid = 3

# Symlink-Schutz: Verhindert bestimmte Klassen von Privilege-Escalation-Angriffen
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# =============================================================================
# ─── Speicher-Hardening ──────────────────────────────────────────────────────
# =============================================================================

# Swap nur bei absolutem Bedarf (bevorzuge RAM-Nutzung)
# Gut für Server mit viel RAM
vm.swappiness = 10

# =============================================================================
# ─── Netzwerk-Performance (optional, Server-optimiert) ───────────────────────
# =============================================================================

# Größere Socket-Buffer für bessere Netzwerk-Performance
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728

# BBR Congestion Control (benötigt Kernel 4.9+)
# Besserer Durchsatz bei Hochlatenznetzwerken (Hetzner-Netzwerk)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
