# =============================================================================
# DATEI:        config/ssh/sshd_hardened.conf
# ZWECK:        SSH-Hardening nach BSI TR-02102-4 und CIS Benchmark
# EINBINDEN:    Include /etc/ssh/sshd_config.d/hardened.conf
#               (oder: cp sshd_hardened.conf /etc/ssh/sshd_config.d/hardened.conf)
# TESTEN:       sshd -t  (Syntaxprüfung ohne Neustart)
# ROLLBACK:     rm /etc/ssh/sshd_config.d/hardened.conf && systemctl restart sshd
# WARNUNG:      SSH-Port und Key MÜSSEN vorhanden sein bevor Passwort-Auth deaktiviert!
# =============================================================================

# ─── Port ─────────────────────────────────────────────────────────────────────
# Standard-Port für diese Infra; Port 22 ist Angriffsvektor Nummer 1.
# ANPASSEN: Auf gewünschten Port setzen (z.B. 2222)
Port 22

# ─── Protokoll und Algorithmen ────────────────────────────────────────────────
# Nur ed25519 und ECDSA Schlüssel erlauben (RSA veraltet)
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_ecdsa_key

# Moderne, sichere Kex-Algorithmen (BSI TR-02102-4)
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512

# Nur starke Ciphers (AES-GCM, ChaCha20)
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com

# MACs: nur ETM (Encrypt-Then-MAC) — resistent gegen Lucky13
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

# ─── Authentifizierung ────────────────────────────────────────────────────────
# KRITISCH: Passwort-Auth deaktivieren — NUR Public-Key!
PasswordAuthentication no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no

# Root-Login: nur mit Key erlauben (für Ansible notwendig)
# Sobald ein dedizierter Admin-User existiert: auf 'no' setzen!
PermitRootLogin prohibit-password

# Leere Passwörter nie erlauben
PermitEmptyPasswords no

# Maximale Anmeldeversuche (Schutz vor Bruteforce)
MaxAuthTries 3

# Timeout für Loginversuche (in Sekunden)
LoginGraceTime 30

# ─── Sitzungseinschränkungen ──────────────────────────────────────────────────
# Maximale gleichzeitige unauthentifizierte Verbindungen
MaxStartups 10:30:60

# Kein X11-Forwarding (nicht benötigt, Angriffsfläche)
X11Forwarding no

# Kein TCP-Forwarding (außer explizit benötigt)
AllowTcpForwarding no

# Kein Agent-Forwarding
AllowAgentForwarding no

# Kein Tunnel
PermitTunnel no

# ─── Keep-Alive ───────────────────────────────────────────────────────────────
# Verbindung prüfen: alle 300s Keepalive, max 3 Versuche = 900s Timeout
ClientAliveInterval 300
ClientAliveCountMax 3

# ─── Logging ──────────────────────────────────────────────────────────────────
# VERBOSE: FingerPrint-Logging für Audit-Trail
LogLevel VERBOSE
SyslogFacility AUTH

# ─── Sicherheits-Flags ────────────────────────────────────────────────────────
# StrictModes: Prüft Berechtigungen von ~/.ssh und authorized_keys
StrictModes yes

# PrintLastLog: Zeigt letzte Login-Zeit
PrintLastLog yes

# DNS-Auflösung deaktivieren (vermeidet Verzögerungen, verhindert DNS-Spoofing)
UseDNS no

# ─── Erlaubte Benutzer ────────────────────────────────────────────────────────
# ANPASSEN: Nur explizit erlaubte Benutzer dürfen sich einloggen.
# Im Produktivbetrieb unbedingt setzen!
# Beispiel: AllowUsers root ansible-user admin
# AllowUsers root
